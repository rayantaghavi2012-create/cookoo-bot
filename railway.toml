# railway.toml
# ─────────────────────────────────────────────────────────────────────────────
# Railway deployment configuration for Cookoo Telegram Cooking Bot.
# Docs: https://docs.railway.app/reference/config-as-code
# ─────────────────────────────────────────────────────────────────────────────

[build]
# Use Nixpacks (Railway's default builder).
# Nixpacks auto-detects Python via .python-version and installs
# dependencies from requirements.txt — no manual plan needed.
builder = "NIXPACKS"

[deploy]
# The command Railway runs to start the bot after a successful build.
startCommand = "python main.py"

# Restart the bot automatically if it crashes
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
